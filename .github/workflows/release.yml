name: Build Linux and Windows Releases

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload to'
        required: true
        default: 'V1.0.1'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Check required files
        run: |
          test -f install.sh
          test -f requirements.txt
          test -f README.md
          test -f LICENSE
          test -f src/FrameByFrame.py

      - name: Package Linux installer
        run: |
          mkdir -p dist/release/FrameByFrame

          cp -a src requirements.txt README.md LICENSE install.sh \
            dist/release/FrameByFrame/

          if [ -f icon.png ]; then
            cp icon.png dist/release/FrameByFrame/
          fi

          chmod +x dist/release/FrameByFrame/install.sh

          tar -czf dist/release/FrameByFrame-Linux.tar.gz \
            -C dist/release FrameByFrame

          ls -lh dist/release/FrameByFrame-Linux.tar.gz

      - name: Upload Linux release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/release/FrameByFrame-Linux.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Check required files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "install.bat",
            "run-framebyframe.vbs",
            "icon.ico",
            "requirements.txt",
            "README.md",
            "LICENSE",
            "src/FrameByFrame.py"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required file not found: $file"
            }
          }

      - name: Package Windows installer
        shell: pwsh
        run: |
          $package = "dist/release/FrameByFrame"
          New-Item -ItemType Directory -Path $package -Force | Out-Null

          Copy-Item "src" $package -Recurse
          Copy-Item "requirements.txt", "README.md", "LICENSE",
            "install.bat", "run-framebyframe.vbs", "icon.ico" $package

          Compress-Archive `
            -Path $package `
            -DestinationPath "dist/release/FrameByFrame-Windows.zip" `
            -Force

          Get-Item "dist/release/FrameByFrame-Windows.zip" |
            Select-Object Name, Length

      - name: Upload Windows release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" `
            "dist/release/FrameByFrame-Windows.zip" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber
