
name: Build Linux Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload to'
        required: true
        default: 'V1.0.1'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check required files
        run: |
          test -f install.sh
          test -f requirements.txt
          test -f README.md
          test -f LICENSE
          test -f src/FrameByFrame.py

      - name: Package source and installer
        run: |
          mkdir -p dist/release/FrameByFrame

          cp -a src requirements.txt README.md LICENSE install.sh \
            dist/release/FrameByFrame/

          if [ -f icon.png ]; then
            cp icon.png dist/release/FrameByFrame/
          fi

          chmod +x dist/release/FrameByFrame/install.sh

          tar -czf dist/release/FrameByFrame-Linux.tar.gz \
            -C dist/release FrameByFrame

          ls -lh dist/release/FrameByFrame-Linux.tar.gz

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/release/FrameByFrame-Linux.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
