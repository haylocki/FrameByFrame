name: Build Linux Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Linux executable
        run: |
          pyinstaller --onefile --icon=icon.png src/FrameByFrame.py
          mkdir -p dist/release
          cp dist/FrameByFrame dist/release/FrameByFrame
          cp requirements.txt dist/release/
          cp README.md dist/release/
          cp LICENSE dist/release/
          chmod +x dist/release/FrameByFrame

      - name: Create tarball
        run: |
          cd dist/release
          tar -czvf FrameByFrame-Linux.tar.gz \
            FrameByFrame requirements.txt README.md LICENSE

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: dist/release/FrameByFrame-Linux.tar.gz
          fail_on_unmatched_files: true

