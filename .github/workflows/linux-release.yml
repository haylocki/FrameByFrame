name: Build Linux Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-util1 \
            libxcb-keysyms1 \
            libxkbcommon-x11-0 \
            libxcb-render-util0 \
            libxcb-image0 \
            libxcb-shape0 \
            libxcb-xkb1 \
            libxcb-cursor0 \
            libxcb-icccm4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Linux executable
        run: |
          pyinstaller --onefile --icon=icon.png src/FrameByFrame.py
          mkdir -p dist/release
          cp dist/FrameByFrame dist/release/FrameByFrame
          cp requirements.txt dist/release/
          cp README.md dist/release/
          cp LICENSE dist/release/
          chmod +x dist/release/FrameByFrame

      - name: Create tarball
        run: |
          cd dist/release
          tar -czvf FrameByFrame-Linux.tar.gz \
            FrameByFrame requirements.txt README.md LICENSE


      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload V1.0.1 dist/release/FrameByFrame-Linux.tar.gz \
            --repo "$GITHUB_REPOSITORY"


