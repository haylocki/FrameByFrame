name: Build Windows Release

on:
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        architecture: 'x64'
    
    - name: Install dependencies
      run: |
        pip install pyinstaller
    
    - name: Build Windows executable
      run: |
        pyinstaller --onefile --windowed --icon=icon.ico src/FrameByFrame.py
        mkdir dist/release
        copy dist\FrameByFrame.exe dist\release\
        copy requirements.txt dist\release\
        copy README.md dist\release\
        copy LICENSE dist\release\
    
    - name: Upload release asset
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: dist/release/FrameByFrame.exe
        asset_name: FrameByFrame-Windows.exe
        asset_content_type: application/vnd.microsoft.portable-executable